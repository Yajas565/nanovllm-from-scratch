[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nano-vllm"
version = "0.2.0"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.4.0",
    "triton>=3.0.0",
    "transformers>=4.51.0",
    "flash-attn",
    "xxhash",
]

# to install flash-attention first explicitly install the cuda version compatible torch 
# 1. Install prerequisites first
# pip install torch packaging setuptools psutil

# 2. Install FlashAttention without build isolation
# pip install flash-attn --no-build-isolation


[tool.setuptools.packages.find]
where = ["."]
include = ["nanovllm*"]